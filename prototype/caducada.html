<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Izaluminio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAFAFC">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>
<link rel="preload" href="assets/fonts/young-serif.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto y la home entera en miniatura, que pasa despacio de arriba abajo en su marco */
  @font-face { font-family: 'Young Serif'; src: url('assets/fonts/young-serif.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Geologica'; src: url('assets/fonts/geologica.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  :root {
    --fondo: #FAFAFC; --tinta: #383E42; --texto: #4A5068; --acento: #3147A8; --acento-hondo: #102586; --enlace-linea: #3147A8;
    --display: 'Young Serif', Georgia, 'Times New Roman', serif; --cuerpo: 'Geologica', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    --h1-peso: 400; --h1-talla: clamp(1.75rem, 1rem + 2.3vw, 3.1rem); --h1-alto: 1.16; --h1-ancho: 19ch;
    --canal: clamp(16px, 5vw, 72px);
    --alto: min(60svh, 540px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --muelle: linear(0, 0.049, 0.174, 0.34, 0.521, 0.696, 0.849, 0.974, 1.065, 1.124, 1.155, 1.163, 1.153, 1.132, 1.104, 1.075, 1.046, 1.022, 1.002, 0.988, 0.979, 0.974, 0.973, 0.975, 0.979, 0.984, 0.988, 0.993, 0.997, 1, 1.002, 1.004, 1.004, 1.004, 1.004, 1.003, 1);
  }
  @supports not (transition-timing-function: linear(0, 1)) { :root { --muelle: cubic-bezier(.34, 1.56, .64, 1); } }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    min-height: 100svh; display: grid; grid-template-rows: auto 1fr;
    background: var(--fondo); color: var(--tinta);
    font-family: var(--cuerpo); font-size: clamp(1rem, .95rem + .22vw, 1.1875rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip;
  }
  img { display: block; max-width: 100%; height: auto; }

  .cab { padding: clamp(16px, 3svh, 28px) var(--canal) 0; }
  .cab img { height: clamp(40px, 1.4vw + 30px, 56px); width: auto; }

  .aviso {
    width: 100%; max-width: calc(1240px + 2 * var(--canal)); margin-inline: auto;
    padding: clamp(32px, 6svh, 72px) var(--canal) clamp(40px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(44px, 7svh, 72px); align-items: center;
  }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); justify-items: start; min-width: 0; }
  h1 {
    font-family: var(--display); font-weight: var(--h1-peso); font-size: var(--h1-talla); line-height: var(--h1-alto);
    max-width: var(--h1-ancho); letter-spacing: 0; text-wrap: balance; font-synthesis: none;
  }
  .aviso__mas { max-width: 40ch; font-size: clamp(1.0625rem, .95rem + .45vw, 1.375rem); color: var(--texto); text-wrap: pretty; }
  .aviso__mas a {
    display: inline-block; color: var(--tinta); font-weight: 600; overflow-wrap: anywhere;
    text-decoration: underline; text-decoration-color: var(--enlace-linea); text-decoration-thickness: 2px; text-underline-offset: 5px;
    transition: transform .4s var(--muelle);
  }
  .aviso__mas a:hover { color: var(--acento-hondo); transform: translateY(-2px); }
  .aviso__mas a:focus-visible { outline: 2px solid var(--acento); outline-offset: 4px; border-radius: 2px; }
  .aviso__mas a:active { transform: translateY(1px); transition-duration: .12s; }

  /* La home entera, en su marco */
  .miniatura { justify-self: center; }
  .miniatura[hidden] { display: none; }
  .marco { display: block; transition: transform .7s var(--muelle); }
  .ventana { display: block; width: min(300px, calc(100vw - 2 * var(--canal) - 40px)); height: var(--alto); overflow: hidden; }
  .ventana img { width: 100%; }
  .ventana:focus-visible { outline: 3px solid var(--acento); outline-offset: 4px; }

  .marco { padding: 12px; border-radius: 3px; background: linear-gradient(135deg, #6B7378 0%, #454B50 22%, #383E42 55%, #2C3135 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), inset 0 -2px 0 rgba(0, 0, 0, .35), 0 2px 6px rgba(56, 62, 66, .08), 0 34px 76px -30px rgba(49, 71, 168, .4); }
  .ventana { border-radius: 1px; background: #fff; box-shadow: 0 0 0 3px #2A2F33, 0 0 0 4px rgba(255, 255, 255, .14); }

  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }

  /* Una sola entrada al cargar (el texto sube y el marco se asienta); luego la home pasa sola, despacio.
     Al pasar el cursor, el marco se levanta y la home se para donde iba. */
  @keyframes subir { from { opacity: 0; transform: translateY(14px); } }
  @keyframes asentar { from { opacity: 0; transform: translateY(32px) scale(.96); } }
  @keyframes recorrer { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: subir .8s var(--sale) .1s both; }
    .aviso__mas { animation: subir .8s var(--sale) .22s both; }
    .miniatura { animation: asentar 1s var(--muelle) .15s both; }
    .ventana img { animation: recorrer 46s ease-in-out 1.6s infinite alternate; }
    .marco:hover { transform: translateY(-6px) rotate(-.6deg); }
    .marco:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <img src="assets/img/logo-izaluminio.png" width="325" height="107" alt="Izaluminio, servicios para tu hogar">
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <p class="aviso__mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Izaluminio">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="marco">
        <span class="ventana" tabindex="0" aria-label="Miniatura de la home completa">
          <img src="assets/img/home-miniatura.webp" width="480" height="2591" alt="Miniatura de la home propuesta para Izaluminio, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
        </span>
      </span>
    </figure>
  </main>
</body>
</html>
